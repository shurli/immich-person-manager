name: Prepare and verify person manager rename
on:
  push:
    branches: [maintenance/person-manager-image-3003]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/maintenance/person-manager-image-3003'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply scoped rename and deployment changes
        run: python .maintenance-person-manager.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run check:compose
      - name: Build and smoke-test both ports
        run: |
          docker build -t immich-person-manager:test .
          bash scripts/check-container.sh immich-person-manager:test
      - name: Record verified code on maintenance branch only
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- . ':!.github' ':!.maintenance-person-manager.py'
          git commit -m 'Rename app to Immich Person Manager and add image-based Compose on port 3003'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
